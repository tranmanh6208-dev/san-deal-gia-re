<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Săn Deal Giá Rẻ - Ưu Đãi Mỗi Ngày</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#ee4d2d;color:white;padding:20px 15px}
header h1{margin:0;font-size:25px}
header p{margin:8px 0 0}
.container{max-width:1100px;margin:auto;padding:15px}
.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:16px}
h2{font-size:20px;margin:22px 0 15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px #00000012}
.card img{width:100%;height:165px;object-fit:contain;background:white}
.info{padding:10px}
.name{font-size:14px;line-height:1.4;min-height:40px}
.price{color:#ee4d2d;font-size:19px;font-weight:bold;margin-top:8px}
.old{font-size:12px;color:#999;text-decoration:line-through;margin-top:5px}
.desc{font-size:12px;color:#777;margin-top:8px;line-height:1.5}
.buy{display:block;background:#ee4d2d;color:white;text-decoration:none;text-align:center;padding:11px 5px;border-radius:6px;margin-top:12px;font-weight:bold}
.status{text-align:center;padding:25px;color:#555}
footer{text-align:center;padding:22px;color:#777;font-size:12px;line-height:1.6}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
<h1>🛍️ SĂN DEAL GIÁ RẺ</h1>
<p>Săn ưu đãi hấp dẫn mỗi ngày!</p>
</header>

<main class="container">
<input id="search" class="search" type="search" placeholder="🔎 Tìm kiếm sản phẩm...">
<h2>🔥 Sản phẩm ưu đãi</h2>
<div id="status" class="status">Đang tải sản phẩm...</div>
<div id="products" class="grid"></div>
</main>

<footer>
© 2026 Săn Deal Giá Rẻ<br>
Website tiếp thị liên kết. Chúng tôi có thể nhận hoa hồng từ các giao dịch đủ điều kiện. Giá và ưu đãi có thể thay đổi theo Shopee.
</footer>

<script>
const SUPABASE_URL = "https://wnecnwgsctxfeednhheb.supabase.co";
const SUPABASE_KEY = "sb_publishable_VXyRnLXPughqDP6PK7-NDQ_2BU4Lf1r";

const productBox = document.getElementById("products");
const statusBox = document.getElementById("status");
const searchBox = document.getElementById("search");

let allProducts = [];

function money(value){
  if(value === null || value === undefined || value === "") return "";
  const n = Number(value);
  return Number.isFinite(n)
    ? n.toLocaleString("vi-VN") + "đ"
    : String(value);
}

function safeUrl(value){
  try {
    const u = new URL(value);
    if(u.protocol === "https:" || u.protocol === "http:") return u.href;
  } catch(e){}
  return "";
}

function render(items){
  productBox.replaceChildren();

  if(!items.length){
    statusBox.style.display = "block";
    statusBox.textContent = allProducts.length
      ? "Không tìm thấy sản phẩm phù hợp."
      : "Chưa có sản phẩm nào.";
    return;
  }

  statusBox.style.display = "none";

  items.forEach(p => {
    const card = document.createElement("article");
    card.className = "card";

    const imgUrl = safeUrl(p.image_url);
    if(imgUrl){
      const img = document.createElement("img");
      img.src = imgUrl;
      img.alt = p.name || "Sản phẩm";
      img.loading = "lazy";
      img.onerror = () => { img.style.display = "none"; };
      card.appendChild(img);
    }

    const info = document.createElement("div");
    info.className = "info";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = p.name || "Sản phẩm";

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = money(p.price);

    info.append(name, price);

    if(p.original_price !== null &&
       p.original_price !== undefined &&
       p.original_price !== ""){
      const old = document.createElement("div");
      old.className = "old";
      old.textContent = money(p.original_price);
      info.appendChild(old);
    }

    if(p.description){
      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = p.description;
      info.appendChild(desc);
    }

    const aff = safeUrl(p.affiliate_url);
    if(aff){
      const buy = document.createElement("a");
      buy.className = "buy";
      buy.href = aff;
      buy.target = "_blank";
      buy.rel = "noopener noreferrer sponsored";
      buy.textContent = "MUA NGAY 🛒";
      info.appendChild(buy);
    }

    card.appendChild(info);
    productBox.appendChild(card);
  });
}

async function loadProducts(){
  statusBox.style.display = "block";
  statusBox.textContent = "Đang tải sản phẩm...";

  try {
    const endpoint = SUPABASE_URL +
      "/rest/v1/products?select=id,name,image_url,original_price,price,affiliate_url,description,created_at&order=created_at.desc";

    const response = await fetch(endpoint, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    if(!response.ok){
      const detail = await response.text();
      throw new Error("Lỗi Supabase (" + response.status + "). " + detail);
    }

    allProducts = await response.json();
    render(allProducts);
  } catch(err) {
    statusBox.textContent =
      "Không tải được sản phẩm. Hãy kiểm tra tên cột và quyền đọc bảng products trong Supabase.";
    console.error(err);
  }
}

searchBox.addEventListener("input", () => {
  const q = searchBox.value.trim().toLocaleLowerCase("vi");
  render(allProducts.filter(p =>
    String(p.name || "").toLocaleLowerCase("vi").includes(q)
  ));
});

loadProducts();
</script>
</body>
</html>
